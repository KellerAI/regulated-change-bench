[project]
name = "payments"
version = "3.4.0"
description = "Payment disbursement service of the Fernbrook Bank platform"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--strict-markers"
markers = [
    "control(obligation, coverage, domain): bank control test, registered in controls/payments/control-registry.json",
]
