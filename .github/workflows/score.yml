name: score

on:
  push:
  pull_request:

jobs:
  results:
    name: RESULTS.md matches the verdicts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/results.py --check
