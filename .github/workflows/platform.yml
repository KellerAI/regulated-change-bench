name: platform

# Only runs when the platform or the baseline runners change. Verdict-only pushes
# (new runs/, RESULTS.md) are covered by the score workflow alone.
on:
  push:
    paths:
      - "platform/**"
      - "baselines/**"
      - "scripts/setup_tools.sh"
      - ".github/workflows/platform.yml"
  pull_request:
    paths:
      - "platform/**"
      - "baselines/**"
      - "scripts/setup_tools.sh"
      - ".github/workflows/platform.yml"

jobs:
  platform:
    name: platform test suites
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: sh scripts/setup_tools.sh
      - run: |
          cd platform
          JUNIT_JAR="$PWD/../.tools/junit-console.jar" PYTHON="$PWD/../.tools/venv/bin/python" \
            sh ci/run-tests.sh baseline-mortgage "$RUNNER_TEMP/java"
          JUNIT_JAR="$PWD/../.tools/junit-console.jar" PYTHON="$PWD/../.tools/venv/bin/python" \
            sh ci/run-tests.sh baseline-payments "$RUNNER_TEMP/py"
      - run: |
          KAB_PYTHON="$PWD/.tools/venv/bin/python" .tools/venv/bin/python baselines/fixtures/build.py
          KB_FAKE_AWS=1 .tools/venv/bin/python -m pytest -q baselines/tests
